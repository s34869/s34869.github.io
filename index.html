<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - วสุพล สมาธิ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }

        /* Animation จรวดบิน */
        @keyframes rocketFly {
            0%, 100% { transform: translateY(0px) rotate(-45deg); }
            50% { transform: translateY(-15px) rotate(-45deg); }
        }
        @keyframes flamePulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        .animate-rocket { animation: rocketFly 1.2s ease-in-out infinite; }
        .animate-flame { animation: flamePulse 0.4s ease-in-out infinite; }

        /* Animation เปิดเข้าหน้าเว็บ */
        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        .page-enter {
            animation: pageEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 overflow-x-hidden">

    <!-- Preloader หน้าโหลดจรวด -->
    <div id="preloader" class="fixed inset-0 z-[9999] bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex flex-col items-center justify-center">
            <!-- Rocket -->
            <div class="animate-rocket text-5xl text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.6)]">
                <i class="fa-solid fa-rocket"></i>
            </div>
            <!-- Thrust Flame Effect -->
            <div class="animate-flame w-4 h-6 bg-gradient-to-b from-orange-500 to-yellow-300 rounded-full blur-sm -mt-1 transform rotate-180 shadow-[0_0_12px_#f97316]"></div>
        </div>
        <p class="text-xs font-mono text-cyan-400 tracking-[0.3em] mt-6 animate-pulse">LAUNCHING...</p>
    </div>

    <!-- Main Content -->
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl backdrop-blur-md page-enter">
        <div class="w-28 h-28 mx-auto mb-4 rounded-full border-2 border-cyan-400 overflow-hidden shadow-lg shadow-cyan-500/20">
            <img src="file_00000000aeb0820b96665629df534e91.jpg" alt="วสุพล สมาธิ" class="w-full h-full object-cover">
        </div>
        <h1 class="text-2xl font-bold text-white mb-1">นายวสุพล สมาธิ</h1>
        <p class="text-xs text-cyan-400 mb-6 font-mono">ONLINE PORTFOLIO</p>
        
        <div class="space-y-3">
            <a href="details.html" class="block w-full py-3 bg-slate-800 hover:bg-cyan-500/20 text-cyan-400 border border-slate-700 hover:border-cyan-500/50 rounded-xl font-medium transition duration-300 text-sm transform hover:-translate-y-0.5">
                <i class="fa-solid fa-user mr-2"></i> ประวัติส่วนตัว (Personal Profile)
            </a>
            <a href="education.html" class="block w-full py-3 bg-slate-800 hover:bg-purple-500/20 text-purple-400 border border-slate-700 hover:border-purple-500/50 rounded-xl font-medium transition duration-300 text-sm transform hover:-translate-y-0.5">
                <i class="fa-solid fa-graduation-cap mr-2"></i> ประวัติการศึกษา (Education)
            </a>
            <a href="certificates.html" class="block w-full py-3 bg-slate-800 hover:bg-emerald-500/20 text-emerald-400 border border-slate-700 hover:border-emerald-500/50 rounded-xl font-medium transition duration-300 text-sm transform hover:-translate-y-0.5">
                <i class="fa-solid fa-award mr-2"></i> ผลงานและเกียรติบัตร (Certificates)
            </a>
        </div>
    </div>

    <script>
        // JS ซ่อนหน้าโหลดเมื่อเว็บบอร์ดเรียบร้อย
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => preloader.style.display = 'none', 500);
            }, 400);
        });
    </script>
</body>
</html>
